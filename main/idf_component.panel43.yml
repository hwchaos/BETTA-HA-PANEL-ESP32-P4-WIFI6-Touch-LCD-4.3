dependencies:
  # Exact versions: dependencies.lock is not tracked (it is shared by all
  # variants and rewritten on every build), so a fresh build resolves from
  # here. patches/ is written against these versions - bump them together.
  idf: ">=5.5"
  espressif/esp_wifi_remote:
    version: "1.6.5"
    rules:
      - if: "target in [esp32p4]"
  lvgl/lvgl:
    version: "9.6.0~1"
  # Local copy of the registry BSP 1.0.1: the release pins LVGL to exactly
  # 9.5.0, the copy allows the 9.6.0~1 both panels run (see its manifest).
  waveshare/esp32_p4_wifi6_touch_lcd_4_3:
    version: "1.0.1"
    override_path: "../bsp/esp32_p4_wifi6_touch_lcd_4_3"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lvgl_port:
    version: "2.9.0"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lcd_touch:
    version: "1.2.1"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lcd_touch_gt911:
    version: "1.2.0~2"
    rules:
      - if: "target in [esp32p4]"
  joltwallet/littlefs:
    version: "1.21.1"
  espressif/esp_hosted:
    version: "2.11.7"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_websocket_client:
    version: "1.7.0"
  espressif/esp_audio_codec:
    version: "2.4.1"
  78/esp-opus:
    version: "1.0.5"
  # Pulled in by the components above; pinned so a fresh build matches.
  espressif/button:
    version: "4.2.1"
  espressif/eppp_link:
    version: "1.1.6"
  espressif/esp_codec_dev:
    version: "1.5.11"
  espressif/esp_lcd_st7701:
    version: "2.0.3"
  espressif/esp_lv_decoder:
    version: "0.4.3"
  espressif/esp_lv_fs:
    version: "1.0.1"
  espressif/esp_lvgl_adapter:
    version: "0.6.4"
  espressif/esp_mmap_assets:
    version: "2.0.1"
  espressif/esp_new_jpeg:
    version: "1.0.2"
  espressif/esp_serial_slave_link:
    version: "1.1.2"
  espressif/freetype:
    version: "2.14.3~1"
  espressif/knob:
    version: "1.1.0"
  espressif/libpng:
    version: "1.6.58~2"
  espressif/wifi_remote_over_eppp:
    version: "0.3.3"
  espressif/zlib:
    version: "1.3.2~1"
  espressif/cmake_utilities:
    version: "0.5.3"
  espressif/esp_h264:
    version: "1.0.4"
  espressif/usb_host_uvc:
    version: "2.4.2"
